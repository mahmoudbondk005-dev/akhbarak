    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
    (() => {
        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            html.setAttribute('data-theme','dark');
            themeToggle.querySelector('i').classList.replace('fa-moon','fa-sun');
        }
        themeToggle.addEventListener('click', () => {
            const dark = html.getAttribute('data-theme') === 'dark';
            if (dark) {
                html.removeAttribute('data-theme');
                localStorage.setItem('theme','light');
                themeToggle.querySelector('i').classList.replace('fa-sun','fa-moon');
            } else {
                html.setAttribute('data-theme','dark');
                localStorage.setItem('theme','dark');
                themeToggle.querySelector('i').classList.replace('fa-moon','fa-sun');
            }
        });
        document.getElementById('current-date').textContent =
            new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

        const menu = document.getElementById('menuToggle');
        const nav = document.getElementById('mainNav');
        menu.addEventListener('click', () => {
            nav.classList.toggle('active');
            const icon = menu.querySelector('i');
            icon.classList.toggle('fa-bars'); icon.classList.toggle('fa-times');
        });

        const esc = s => String(s ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
        const params = new URLSearchParams(location.search);
        const id = params.get('id');
        const loading = document.getElementById('articleLoading');
        const page = document.getElementById('articlePage');

        if (!id || !window.supabase || !window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) {
            loading.textContent = 'لم يتم العثور على الخبر.';
            return;
        }

        const db = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
        db.from('news').select('*').eq('id', id).single().then(({data,error}) => {
            if (error || !data) {
                loading.textContent = 'الخبر غير موجود أو تم حذفه.';
                return;
            }
            document.title = data.title + ' | اخبارك';
            document.getElementById('articleCategory').innerHTML =
                '<span class="category-badge">' + esc(data.category) + '</span>';
            document.getElementById('articleTitle').textContent = data.title;
            document.getElementById('articleDate').textContent =
                new Date(data.published_at).toLocaleString('ar-EG',{dateStyle:'full',timeStyle:'short'});
            const image = document.getElementById('articleImage');
            if (data.image_url) {
                image.src = data.image_url;
                image.alt = data.title;
                image.style.display = 'block';
            } else image.style.display = 'none';
            document.getElementById('articleExcerpt').textContent = data.excerpt || '';
            document.getElementById('articleExcerpt').style.display = data.excerpt ? 'block' : 'none';
            document.getElementById('articleContent').innerHTML = esc(data.content || '').replace(/\n/g,'<br><br>');
            loading.style.display = 'none';
            page.style.display = 'block';
        });
    })();
    </script>
